# Full torque benchmark: 4 laws x 6 perturbation settings (none + 5 types x 3 levels) x 2 trajectories x 5 seeds.
# Trial id: <trajectory>-<plugin>-<perturbation><level index>-s<seed>; select one with --trial.
# learned_id needs $UR5_DATA_DIR/models/learned_id.npz (see docs/development_workflow.md); remove it to run without.
name: benchmark
trajectories: [bench_reach.csv, bench_sweep.csv]
# Joint terms pd_id_ff and computed_torque add to M, C, g, with values from the URDF <dynamics>:
# viscous b qd_ref and Coulomb Fc tanh(qd_ref / coulomb_epsilon). pd_gravity uses g(q) only.
model_terms: [rigid_body, viscous, coulomb]
coulomb_epsilon: 0.05
controllers:
  - plugin: pd_gravity
    gains:
      kp: [300, 300, 600, 300, 50, 30, 10]
      kd: [10, 10, 40, 10, 0.5, 0.3, 0.1]
  - plugin: pd_id_ff
    gains:
      kp: [300, 300, 600, 300, 50, 30, 10]
      kd: [10, 10, 40, 10, 0.5, 0.3, 0.1]
  # Same N m/rad gains as pd_gravity, divided at runtime by M_jj(q_candle) of the nominal model.
  - plugin: computed_torque
    gains:
      protocol: joint_gain_match_at_candle
      kp: [300, 300, 600, 300, 50, 30, 10]
      kd: [10, 10, 40, 10, 0.5, 0.3, 0.1]
  - plugin: learned_id
    gains:
      kp: [300, 300, 600, 300, 50, 30, 10]
      kd: [10, 10, 40, 10, 0.5, 0.3, 0.1]
      model: learned_id.npz
perturbations:
  - type: none
    levels: [0]
  # Extra viscous friction b_p qd = level x URDF b x measured qd on the torque reaching the
  # proximal joints. Wrists and Coulomb are not perturbed (100 Hz loop stability, see
  # docs/development_workflow.md). Checked at run start per controller: b_p T / m_eff <= 0.5 and
  # (Kd + b_p) T / m_eff <= 1.0, m_eff the smallest M_jj over Candle and both trajectories.
  - type: viscous_friction
    joints: [shoulder_pan_joint1, shoulder_pan_joint, shoulder_lift_joint, elbow_joint]
    levels: [0.0, 0.25, 0.5]
  # Fraction of the commanded torque that reaches the joints.
  - type: gain_loss
    levels: [0.9, 0.8, 0.7]
  # Gaussian noise (rad/s, 1 sigma) on the velocity the control law sees.
  - type: velocity_noise
    levels: [0.005, 0.02, 0.05]
  # Point mass (kg) at the tool link, as a constant downward force.
  - type: tip_payload
    levels: [0.5, 1.0, 2.0]
  # Constant force (N) at the tool link, world frame.
  - type: tip_force
    levels: [[5, 0, 0], [10, 0, 0], [20, 0, 0]]
seeds: [0, 1, 2, 3, 4]
hold_sec: 1.0
post_hold_sec: 1.0

# Acceptance slice: 2 controllers x 2 gain-loss levels x 2 seeds on one trajectory = 8 trials.
# Runs unattended on one Gazebo process: ur5 torque experiment_slice.yaml
name: slice
trajectories: [bench_reach.csv]
model_terms: [rigid_body, viscous, coulomb]
coulomb_epsilon: 0.05
controllers:
  - plugin: pd_gravity
    gains:
      kp: [300, 300, 600, 300, 50, 30, 10]
      kd: [10, 10, 40, 10, 0.5, 0.3, 0.1]
  # Same N m/rad gains as pd_gravity, divided at runtime by M_jj(q_candle) of the nominal model.
  - plugin: computed_torque
    gains:
      protocol: joint_gain_match_at_candle
      kp: [300, 300, 600, 300, 50, 30, 10]
      kd: [10, 10, 40, 10, 0.5, 0.3, 0.1]
perturbations:
  - type: gain_loss
    levels: [1.0, 0.8]
seeds: [0, 1]
hold_sec: 1.0
post_hold_sec: 1.0

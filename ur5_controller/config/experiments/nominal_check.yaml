# Nominal sanity check before the full matrix: each model-based law on both trajectories, no
# perturbation, one seed. Expect computed_torque and pd_id_ff tracking error <= pd_gravity.
# Run: ur5 torque nominal_check.yaml
name: nominal_check
trajectories: [bench_reach.csv, bench_sweep.csv]
# Joint terms pd_id_ff and computed_torque add to M, C, g, with values from the URDF <dynamics>:
# viscous b qd_ref and Coulomb Fc tanh(qd_ref / coulomb_epsilon). pd_gravity uses g(q) only.
model_terms: [rigid_body, viscous, coulomb]
coulomb_epsilon: 0.05
controllers:
  - plugin: pd_gravity
    gains:
      kp: [300, 300, 600, 300, 50, 30, 10]
      kd: [10, 10, 40, 10, 0.5, 0.3, 0.1]
  - plugin: pd_id_ff
    gains:
      kp: [300, 300, 600, 300, 50, 30, 10]
      kd: [10, 10, 40, 10, 0.5, 0.3, 0.1]
  - plugin: computed_torque
    gains:
      kp: [100, 100, 100, 100, 100, 100, 100]
      kd: [20, 20, 20, 20, 20, 20, 20]
perturbations:
  - type: none
    levels: [0]
seeds: [0]
hold_sec: 1.0
post_hold_sec: 1.0

# Task-space input for `ur5 plan <name> --points example.points.yaml`.
# tool0 poses in the world frame: xyz in metres, rpy in radians. A point without rpy keeps the
# previous orientation. Candle is a straight-arm singularity, so the first point sets an
# orientation the arm can reach on a straight line from it.
points:
  - {xyz: [-0.0916, 0.0277, 1.8011], rpy: [2.9235, 1.0896, 0.4011]}
  - {xyz: [-0.2319, 0.3063, 1.8197], rpy: [-2.7275, 1.0696, -0.3404]}
  - {xyz: [-0.0479, 0.1022, 1.8514], rpy: [2.4890, 1.5082, -0.3715]}
return_home: true
